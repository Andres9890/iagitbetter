name: Archive Repo to IA

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Git URL to archive'
        required: true
        default: 'https://github.com/'
      args:
        description: 'Command arguments for iagitbetter (--all-files --all-branches --releases --all-releases)'
        required: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Set up Python
      uses: actions/setup-python@main
      with:
        python-version: '3.x'

    - name: Cache pip and IA config
      uses: actions/cache@main
      with:
        path: |
          ~/.cache/pip
          ~/.config/internetarchive
        key: ${{ runner.os }}-archive-cache-${{ hashFiles('.github/workflows/iagitbetter.yml') }}
        restore-keys: |
          ${{ runner.os }}-archive-cache-

    - name: Install iagitbetter and IA CLI
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Configure IA CLI
      env:
        IA_EMAIL: ${{ secrets.IA_EMAIL }}
        IA_PASSWORD: ${{ secrets.IA_PASSWORD }}
      run: |
        # Check if the internetarchive config directory was restored from cache
        if [ ! -d ~/.config/internetarchive ]; then
          printf "%s\n%s\n" "$IA_EMAIL" "$IA_PASSWORD" | ia configure
        else
          echo "IA config found in cache, skipping config"
        fi

    - name: Run iagitbetter
      run: |
        iagitbetter ${{ github.event.inputs.args }} ${{ github.event.inputs.url }}
